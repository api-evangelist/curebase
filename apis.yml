name: Curebase
description: 'Curebase is a San Francisco-based clinical trials technology company (founded 2017)
  that provides a modern, AI-native eClinical platform for sponsors, CROs, biotechs, MedTech
  companies, and research sites. The platform unifies the full trial lifecycle in one system:
  ePRO/eCOA (electronic patient-reported and clinical outcome assessments), eConsent (digital
  informed consent), EDC (electronic data capture), patient recruitment and screening, participant
  engagement and retention tooling, and site management. Curebase also ships Sitebase, a free
  eClinical suite for research sites, and Hope, a conversational AI voice agent. It supports
  decentralized and hybrid trial models natively. Curebase is a private, venture-backed company
  (Series B led by Industry Ventures; investors include GGV Capital, Acrew, Gilead, and others).
  It is SOC 2 Type II certified and GDPR compliant. Curebase does not publish a public developer
  API or API documentation; integration is handled through enterprise engagements.'
